{{template "layout" .}}
{{define "content"}}
<div class="page-content">
    <!-- Upload -->
    <div class="card">
        <h3 data-i18n="package.uploadTitle">上传发布包</h3>
        <div id="package-upload-area"
             style="border:2px dashed var(--border-color, #444); border-radius:8px; padding:1.5rem; text-align:center; cursor:pointer;"
             onclick="document.getElementById('package-file-input').click()">
            <div style="font-size:1.6rem;">📦</div>
            <div data-i18n="package.uploadHint">点击选择或拖拽 .pkg 文件到此处</div>
            <div class="text-muted text-small" style="margin-top:0.5rem;" data-i18n="package.uploadFormat">格式：phaethon_linux_amd64_v1.0.0.pkg（zip 包含 binary + meta.json + signature）</div>
        </div>
        <input type="file" id="package-file-input" accept=".pkg" class="hidden">
        <div id="package-upload-progress" class="hidden" style="margin-top:0.75rem;">
            <div class="text-muted text-small" id="package-upload-status"></div>
            <div style="background:var(--bg-tertiary, #222); border-radius:4px; height:10px; overflow:hidden; margin-top:4px;">
                <div id="package-upload-bar" style="background:var(--accent); height:100%; width:0%; transition:width 0.2s;"></div>
            </div>
        </div>
        <div id="package-disabled-warn" class="hidden" style="margin-top:0.75rem; padding:0.5rem 0.75rem; background:rgba(248,81,73,0.1); border-radius:6px; color:var(--text-secondary);" data-i18n="package.uploadDisabledWarn"></div>
    </div>

    <!-- Package list grouped by platform/arch -->
    <div id="package-groups-container"></div>
    <div id="package-list-empty" class="text-muted"></div>
</div>

<script>
(function() {
    const PackagePage = {
        data: null,

        t(key, fallback) {
            if (typeof i18n !== 'undefined' && i18n.t) {
                const val = i18n.t(key);
                if (val !== key) return val;
            }
            return fallback || key;
        },

        init() {
            this.setupUpload();
            this.setupSSE();
            this.refresh();
        },

        setupSSE() {
            const sse = new EventSource('./api/events');
            let lastVersion = 0;
            sse.addEventListener('heartbeat', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.packages && data.packages > lastVersion) {
                        lastVersion = data.packages;
                        this.refresh();
                    }
                } catch {}
            });
            sse.onerror = () => {
                sse.close();
            };
        },

        setupUpload() {
            const area = document.getElementById('package-upload-area');
            const input = document.getElementById('package-file-input');

            // Drag & drop
            area.addEventListener('dragover', e => {
                e.preventDefault();
                area.style.borderColor = 'var(--accent)';
            });
            area.addEventListener('dragleave', () => {
                area.style.borderColor = '';
            });
            area.addEventListener('drop', e => {
                e.preventDefault();
                area.style.borderColor = '';
                if (e.dataTransfer.files.length > 0) {
                    this.uploadFile(e.dataTransfer.files[0]);
                }
            });

            // File input
            input.addEventListener('change', () => {
                if (input.files.length > 0) {
                    this.uploadFile(input.files[0]);
                }
            });
        },

        uploadFile(file) {
            if (!file.name.endsWith('.pkg')) {
                showToast(this.t('package.toast.invalidFormat', '请选择 .pkg 文件'), 'error');
                return;
            }

            const progress = document.getElementById('package-upload-progress');
            const status = document.getElementById('package-upload-status');
            const bar = document.getElementById('package-upload-bar');

            progress.classList.remove('hidden');
            status.textContent = this.t('package.uploading', '上传中…');
            bar.style.width = '0%';

            const formData = new FormData();
            formData.append('file', file);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', './api/packages/upload');

            xhr.upload.onprogress = e => {
                if (e.lengthComputable) {
                    const pct = (e.loaded / e.total * 100).toFixed(0);
                    bar.style.width = pct + '%';
                    status.textContent = this.t('package.uploading', '上传中…') + ' ' + pct + '%';
                }
            };

            xhr.onload = () => {
                if (xhr.status === 201) {
                    status.textContent = this.t('package.uploadOk', '上传成功');
                    bar.style.width = '100%';
                    showToast(this.t('package.toast.uploadOk', '发布包上传成功'), 'success');
                    setTimeout(() => {
                        progress.classList.add('hidden');
                        this.refresh();
                    }, 1500);
                } else {
                    const err = JSON.parse(xhr.responseText);
                    status.textContent = this.t('package.uploadFailed', '上传失败') + ': ' + (err.error || xhr.statusText);
                    showToast(this.t('package.toast.uploadFailed', '上传失败') + ': ' + (err.error || ''), 'error');
                }
            };

            xhr.onerror = () => {
                status.textContent = this.t('package.uploadFailed', '上传失败');
                showToast(this.t('package.toast.networkError', '网络错误'), 'error');
            };

            xhr.send(formData);
        },

        refresh() {
            fetch('./api/packages')
                .then(r => r.json())
                .then(data => {
                    this.data = data;
                    this.render();
                })
                .catch(err => {
                    console.error('fetch packages failed:', err);
                });
        },

        render() {
            const container = document.getElementById('package-groups-container');
            const empty = document.getElementById('package-list-empty');
            const packages = this.data.packages || [];

            container.innerHTML = '';
            empty.textContent = packages.length === 0 ? this.t('package.emptyList', '暂无发布包') : '';

            // Group by platform/arch
            const groups = {};
            packages.forEach(pkg => {
                const key = pkg.meta.platform + '/' + pkg.meta.arch;
                if (!groups[key]) groups[key] = [];
                groups[key].push(pkg);
            });

            // Sort groups by key
            const sortedKeys = Object.keys(groups).sort();

            sortedKeys.forEach(key => {
                const pkgs = groups[key];
                // Sort by version descending within group
                pkgs.sort((a, b) => {
                    return this.compareVersions(b.meta.version, a.meta.version);
                });

                const card = document.createElement('div');
                card.className = 'card';
                card.style.marginTop = '1rem';

                const title = document.createElement('h3');
                title.textContent = '🖥️ ' + key + ' (' + pkgs.length + ')';
                card.appendChild(title);

                const tableWrap = document.createElement('div');
                tableWrap.className = 'table-responsive';
                tableWrap.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th data-i18n="package.colFilename">文件名</th>
                                <th data-i18n="package.colVersion">版本</th>
                                <th data-i18n="package.colSize">大小</th>
                                <th data-i18n="package.colTime">上传时间</th>
                                <th data-i18n="package.colSignature">签名</th>
                                <th data-i18n="package.colActions">操作</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                `;
                const tbody = tableWrap.querySelector('tbody');

                pkgs.forEach(pkg => {
                    const tr = document.createElement('tr');
                    const sigBadge = pkg.signatureValid
                        ? '<span class="badge badge-info">✅</span>'
                        : '<span class="badge badge-error">❌</span>';

                    tr.innerHTML =
                        '<td style="font-family:monospace;">' + this.escapeHtml(pkg.filename) + '</td>' +
                        '<td>' + this.escapeHtml(pkg.meta.version) + '</td>' +
                        '<td>' + this.fmtSize(pkg.size) + '</td>' +
                        '<td>' + this.fmtTime(pkg.uploadedAt) + '</td>' +
                        '<td>' + sigBadge + '</td>' +
                        '<td>' +
                        '<button class="btn btn-sm btn-outline" onclick="PackagePage.download(\'' + pkg.id + '\')">' + this.t('package.download', '下载') + '</button>' +
                        '</td>';
                    tbody.appendChild(tr);
                });

                card.appendChild(tableWrap);
                container.appendChild(card);
            });
        },

        compareVersions(a, b) {
            // Simple version comparison (v1.2.3 format)
            const parseVer = v => v.replace(/^v/, '').split(/[.\+]/).map(x => parseInt(x) || 0);
            const va = parseVer(a), vb = parseVer(b);
            for (let i = 0; i < Math.max(va.length, vb.length); i++) {
                const na = va[i] || 0, nb = vb[i] || 0;
                if (na > nb) return 1;
                if (na < nb) return -1;
            }
            return 0;
        },

        download(id) {
            window.open('./api/packages/' + id + '/download', '_blank');
        },

        escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        },

        fmtSize(bytes) {
            if (bytes == null) return '-';
            if (typeof formatBytes === 'function') return formatBytes(bytes);
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        },

        fmtTime(t) {
            if (!t) return '-';
            const d = new Date(t);
            return d.toLocaleString();
        }
    };

    window.PackagePage = PackagePage;

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => PackagePage.init());
    } else {
        PackagePage.init();
    }
})();
</script>
{{end}}
