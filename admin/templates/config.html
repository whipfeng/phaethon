{{template "layout" .}}
{{define "content"}}
<div class="page-content">
    <div class="card">
        <div class="card-header">
            <h3 data-i18n="export.title">Export Config</h3>
            <div>
                <button onclick="copyRawConfig()" class="btn btn-outline btn-sm" data-i18n="export.copy">📋 Copy</button>
                <button onclick="downloadRawConfig()" class="btn btn-primary btn-sm" data-i18n="export.download">📥 Download YAML</button>
            </div>
        </div>
        <p class="text-muted" data-i18n="export.help">View and export the current configuration as YAML. Use fine-grained APIs for config changes.</p>
        <div class="form-group">
            <textarea id="raw-config-text" class="form-control raw-config-text" spellcheck="false" readonly data-i18n-placeholder="export.placeholder" placeholder="Loading configuration..."></textarea>
        </div>
        <div id="raw-status" class="raw-status hidden"></div>
    </div>
</div>

<script>
(function() {
    const textarea = document.getElementById('raw-config-text');
    const statusEl = document.getElementById('raw-status');

    function showStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.className = 'raw-status ' + (type || 'info');
        statusEl.classList.remove('hidden');
    }

    async function loadRawConfig() {
        try {
            const res = await fetch('./api/config/raw');
            if (!res.ok) throw new Error(await res.text());
            textarea.value = await res.text();
            statusEl.classList.add('hidden');
        } catch (err) {
            const label = typeof i18n !== 'undefined' ? i18n.t('toast.networkError') : 'Error';
            showStatus(label + ': ' + err.message, 'error');
        }
    }

    window.copyRawConfig = async function() {
        try {
            await navigator.clipboard.writeText(textarea.value);
            const msg = typeof i18n !== 'undefined' ? i18n.t('export.copied') : 'Copied to clipboard';
            showStatus(msg, 'success');
        } catch (err) {
            textarea.select();
            document.execCommand('copy');
            const msg = typeof i18n !== 'undefined' ? i18n.t('export.copied') : 'Copied to clipboard';
            showStatus(msg, 'success');
        }
    };

    window.downloadRawConfig = function() {
        const blob = new Blob([textarea.value], { type: 'text/yaml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'config.yaml';
        a.click();
        URL.revokeObjectURL(url);
        const msg = typeof i18n !== 'undefined' ? i18n.t('export.downloaded') : 'Config downloaded';
        showStatus(msg, 'success');
    };

    loadRawConfig();
})();
</script>
{{end}}
