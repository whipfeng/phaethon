# Safe built-in defaults for phaethon.
# No credentials or infrastructure addresses are embedded here.
# On first run, phaethon copies this file to config.yaml in the working directory.

proxies: []
proxy-groups: []
subscriptions: []

mappings:
  - name: local-socks5
    type: socks5
    port: 7890

rules:
  - MATCH,DIRECT

resolvers: []

interactive: false
udp-port-range: ""
tcp-port-range: ""

admin:
  enabled: true
  addr: 0.0.0.0:39999
  token: ""
  auth-enabled: false
  username: ""
  password: ""

tun:
  enabled: false
  bypass-gateway: false
  direct-nameserver: []
  # dhcp:
  #   enabled: false
  #   pool-start: ""    # auto-generated from interface subnet if empty
  #   pool-end: ""
  #   lease-time: "24h"
