{{template "layout" .}}
{{define "content"}}
<div class="page-content">
    <div class="card">
        <h3 data-i18n="logs.title">📋 运行日志</h3>
        <pre class="tun-log" id="conn-logs" style="height:calc(100vh - 200px); overflow-y:auto;" data-i18n="common.loading">Loading...</pre>
    </div>
</div>

<script>
(function() {
    // Fetch logs initially
    fetchConnectionsLogs();
    
    // Set up SSE for real-time updates
    if (typeof startSSE === 'function') {
        startSSE();
    }
})();

function fetchConnectionsLogs() {
    fetch('./api/connections')
        .then(r => r.json())
        .then(data => {
            const logsEl = document.getElementById('conn-logs');
            if (logsEl && data.logs) {
                logsEl.textContent = data.logs.join('\n');
                logsEl.scrollTop = logsEl.scrollHeight;
            }
        })
        .catch(() => {});
}

// Update logs on SSE events
document.addEventListener('sse-logs', function(e) {
    const logsEl = document.getElementById('conn-logs');
    if (logsEl && e.detail && e.detail.logs) {
        logsEl.textContent = e.detail.logs.join('\n');
        logsEl.scrollTop = logsEl.scrollHeight;
    }
});
</script>
{{end}}
