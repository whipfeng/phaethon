{{template "layout" .}}
{{define "content"}}
<div class="page-content" style="display:flex; flex-direction:column; flex:1; min-height:0;">
    <div class="card" style="flex:1; display:flex; flex-direction:column; margin-bottom:0; min-height:0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-shrink:0;">
            <h3 style="margin:0;" data-i18n="connections.title">🔗 活跃连接</h3>
            <span id="active-conn-count" class="text-muted" data-i18n="dash.activeConnCount">0 个连接</span>
        </div>
        <div id="active-conns-list" style="flex:1; overflow-y:auto;">
            <p class="text-muted" data-i18n="dash.noActiveConns">暂无活跃连接</p>
        </div>
    </div>
</div>

<script>
(function() {
    fetchActiveConns();
    startActiveConnsTimer();
})();
</script>
{{end}}
