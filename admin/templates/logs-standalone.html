<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaethon - Runtime Logs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 500;
            color: #f0f6fc;
        }
        .header .actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
        }
        .btn:hover { background: #30363d; }
        .btn-outline { background: transparent; }
        .btn-danger { border-color: #f85149; color: #f85149; }
        .btn-danger:hover { background: #f8514920; }
        .logs-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #logs {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono', 'Droid Sans Mono', 'Source Code Pro', monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-line { padding: 2px 0; }
        .log-line.ok { color: #3fb950; }
        .log-line.fail, .log-line.reject { color: #f85149; }
        .log-time { color: #8b949e; margin-right: 8px; }
        .log-icon { margin-right: 4px; }
        .status-bar {
            background: #161b22;
            border-top: 1px solid #30363d;
            padding: 8px 20px;
            font-size: 12px;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .auto-scroll-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .auto-scroll-toggle input { cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1 data-i18n="logs.title">📋 运行日志</h1>
        <div class="actions">
            <button class="btn btn-outline" onclick="fetchLogs(true)" data-i18n="logs.refresh">🔄 刷新</button>
            <button class="btn btn-danger" onclick="clearLogs()" data-i18n="logs.clear">🗑 清空</button>
        </div>
    </div>
    <div class="logs-container">
        <div id="logs">Loading...</div>
    </div>
    <div class="status-bar">
        <span id="log-count" data-i18n="logs.count">0 条日志</span>
        <label class="auto-scroll-toggle">
            <input type="checkbox" id="auto-scroll" checked>
            <span data-i18n="logs.autoScroll">自动滚动</span>
        </label>
    </div>

    <script src="./static/i18n.js"></script>
    <script>
        // Apply i18n
        if (typeof applyI18n === 'function') {
            applyI18n();
        }

        let lastSeq = 0;
        let logCount = 0;
        const logsEl = document.getElementById('logs');
        const countEl = document.getElementById('log-count');
        const autoScrollEl = document.getElementById('auto-scroll');

        function formatLog(e) {
            const time = new Date(e.time).toLocaleTimeString('en-US', {hour12: false, fractionalSecondDigits: 3});
            const icon = e.status === 'ok' ? '✓' : '✗';
            const proxy = e.proxy || 'DIRECT';
            const inbound = e.inbound || '';
            let text = `${icon} [${inbound}] ${e.protocol} ${e.dstAddr}:${e.dstPort} → ${proxy}`;
            if (e.error) text += ` (${e.error})`;
            return { time, text, status: e.status };
        }

        function appendLog(log) {
            const div = document.createElement('div');
            div.className = `log-line ${log.status}`;
            div.innerHTML = `<span class="log-time">[${log.time}]</span><span class="log-icon">${log.text.charAt(0)}</span>${log.text.substring(2)}`;
            logsEl.appendChild(div);
            logCount++;
            updateCount();
            if (autoScrollEl.checked) {
                logsEl.scrollTop = logsEl.scrollHeight;
            }
        }

        function updateCount() {
            const key = (typeof getCurrentLang === 'function' && getCurrentLang() === 'en') ? 'logs.countEn' : 'logs.count';
            const template = (typeof t === 'function') ? t(key) : (logCount + ' 条日志');
            countEl.textContent = template.replace('{count}', logCount);
        }

        async function fetchLogs(full) {
            try {
                let url = './api/connections';
                if (!full && lastSeq > 0) {
                    url += '?after=' + lastSeq;
                }
                const res = await fetch(url);
                if (!res.ok) throw new Error('status ' + res.status);
                const data = await res.json();
                if (!data.logs || data.logs.length === 0) {
                    if (full) {
                        logsEl.textContent = (typeof t === 'function') ? t('logs.noLogs') : '暂无日志';
                        logCount = 0;
                        updateCount();
                    }
                    return;
                }
                if (full) {
                    logsEl.textContent = '';
                    logCount = 0;
                }
                data.logs.forEach(e => {
                    appendLog(formatLog(e));
                    lastSeq = e.seq;
                });
            } catch (err) {
                if (full) {
                    logsEl.textContent = 'Failed to load: ' + err.message;
                }
            }
        }

        function clearLogs() {
            logsEl.textContent = (typeof t === 'function') ? t('logs.noLogs') : '暂无日志';
            logCount = 0;
            lastSeq = 0;
            updateCount();
        }

        // Initial load
        fetchLogs(true);

        // SSE for real-time updates
        const sse = new EventSource('./api/events');
        let lastVersion = 0;
        sse.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                if (data.versions && data.versions.logs > lastVersion) {
                    lastVersion = data.versions.logs;
                    fetchLogs(false);
                }
            } catch {}
        };
        sse.onerror = () => {
            sse.close();
            setInterval(() => fetchLogs(false), 2000);
        };
    </script>
</body>
</html>
